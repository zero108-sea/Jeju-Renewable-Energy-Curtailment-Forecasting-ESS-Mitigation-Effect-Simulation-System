# [왜 테마를 고정하나 — 2026-10-10]
# 이 설정이 없으면 Streamlit이 **보는 사람의 OS 설정**을 따라간다. 그런데 대시보드의
# 위험 등급 색은 흰 배경을 전제로 검증했다:
#
#   #d03b3b(critical) / #ec835a(serious) — CVD ΔE 13.9, 일반시야 15.7, 흰 배경 기준 전 항목 PASS
#
# 다크 배경에서는 이 대비가 성립하지 않는다. 다크 모드는 자동으로 뒤집는 것이 아니라
# 같은 색 계열에서 **다시 골라 다시 검증해야** 하는 별도 작업이다. 시연 PC가 어떤 설정일지
# 알 수 없으므로, 검증한 조건을 고정한다.
#
# 다크 모드를 지원하려면: 다크 배경(#1a1a19 등)으로 검증기를 다시 돌려 색을 다시 고르고,
# 그 값을 app.py에 모드별로 넣어야 한다. 그 전에는 light 고정이 정직하다.
[theme]
base = "light"

[server]
headless = true

[browser]
gatherUsageStats = false
