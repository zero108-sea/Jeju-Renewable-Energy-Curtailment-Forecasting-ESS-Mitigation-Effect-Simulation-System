spring:
  application:
    name: curtailment-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/curtailment_db
    username: postgres
    password: ${DB_PASSWORD:postgres}   # <-- postgres 설치 시 정한 실제 비밀번호로 변경
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

# Python AI 서버 주소 (내부 통신 전용, 외부 비노출)
# 통신규격 확정서 v1.1(04장) 기준: uvicorn app.main:app --port 8000
ai-server:
  base-url: http://localhost:8000
